[package]
name = "spamfilter"
version = "0.1.0"
edition = "2021"
description = "SMS spam classifier: multinomial naive Bayes written from scratch, compared against linfa, served as a CLI and an Axum API"
license = "MIT"

[lib]
name = "spamfilter"
path = "src/lib.rs"

[[bin]]
name = "spamfilter"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Comparison model only: everything in src/nb.rs is written by hand.
linfa = "0.8"
linfa-bayes = "0.8"
ndarray = "0.16"

[dev-dependencies]
approx = "0.5"
